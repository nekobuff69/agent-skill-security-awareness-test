<!DOCTYPE html>
<html lang="en" data-bank="questions.json" data-corpus="docs/owasp-ast-full.md" data-lang-alt="zh/" data-lang-alt-locale="zh" data-lang-alt-lang="zh-Hans" data-lang-alt-dict="i18n/zh.js" data-lang-alt-bank="questions.zh.json">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover (ADR 0022): the desktop paints to the screen's
       edge, and css/shell.css pays the system's insets back through
       env(safe-area-inset-*) so the taskbar and the frame never sit under
       the gesture band or the notch. Without cover the browser insets the
       viewport itself and the bar floats above the screen's bottom edge. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent Security Awareness Quiz</title>

  <!-- Language relationships: one assessment in two languages, so the two
       URLs are declared as variants of each other rather than competing.
       Host-relative, so they are correct on whatever origin this is served
       from. -->
  <link rel="canonical" href="/">
  <link rel="alternate" hreflang="en" href="/">
  <link rel="alternate" hreflang="zh-Hans" href="/zh/">
  <link rel="alternate" hreflang="x-default" href="/">

  <!-- Share preview. Authored here rather than resolved from the dictionary:
       a preview is read by crawlers that never run the page's JavaScript, so
       it has to exist in the static document. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Agent Security Awareness Quiz">
  <meta property="og:description" content="An agent skill runs with your permissions. Do you know what yours does?">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="zh_CN">
  <meta property="og:url" content="https://agent-security-quiz.pages.dev/">
  <!-- One language-neutral card serves both pages: it carries no prose, so a
       share from /zh/ never renders English text. og:image must be absolute
       and must be in the static document — crawlers do not run this page's
       JavaScript — so it cannot be derived at runtime. Change with the
       production origin. -->
  <meta property="og:image" content="https://agent-security-quiz.pages.dev/og-card.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Risk Radar chart of scores across the ten OWASP Agentic Skills Top 10 risks.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Agent Security Awareness Quiz">
  <meta name="twitter:description" content="An agent skill runs with your permissions. Do you know what yours does?">
  <meta name="twitter:image" content="https://agent-security-quiz.pages.dev/og-card.png">
  <meta name="twitter:image:alt" content="Risk Radar chart of scores across the ten OWASP Agentic Skills Top 10 risks.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/results.css">
  <link rel="stylesheet" href="css/theme-retro-os.css">
  <link rel="stylesheet" href="css/boot.css">
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <div id="app">
    <section id="landing-view" class="wizard"></section>
    <section id="quiz-view" hidden></section>
    <section id="results-view" hidden></section>
    <section id="review-view" hidden></section>
  </div>

  <script src="js/i18n.js"></script>
  <script src="i18n/en.js"></script>
  <script src="config.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/ast.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/session-store.js"></script>
  <script src="js/desktop-store.js"></script>
  <script src="js/lang-pref.js"></script>
  <script src="js/lang-routing.js"></script>
  <script src="js/lang-switch.js"></script>
  <script src="js/prompt-builder.js"></script>
  <script src="js/fallback.js"></script>
  <script src="js/extractor.js"></script>
  <script src="js/validator.js"></script>
  <script src="js/llm-client.js"></script>
  <script src="js/action-plan.js"></script>
  <script src="js/main.js"></script>
  <script src="js/wizard-nav.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/desktop-core.js"></script>
  <script src="js/windows.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
